<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大和電気株式会社 | 宮城県名取市の電気工事・空調設備</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <style>
        /* --- 1. 全体設定 --- */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: #fff; color: #333; overflow-x: hidden;
        }

        /* --- 2. 共通ヘッダー --- */
        header {
            position: fixed; top: 0; width: 100%; padding: 15px 40px; box-sizing: border-box; z-index: 100;
            background: rgba(0, 0, 0, 0.7); display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(8px);
        }
        .logo-area { display: flex; align-items: center; text-decoration: none; color: white; z-index: 110; }
        .logo-image { height: 50px; width: auto; margin-right: 15px; }
        .company-name { font-size: 24px; font-weight: bold; letter-spacing: 0.1em; }

        nav ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 30px; }
        nav ul li a { 
            text-decoration: none; color: white; 
            display: flex; flex-direction: column; align-items: center; 
            transition: 0.3s; position: relative; padding-bottom: 5px;
        }
        .nav-jp { font-size: 15px; font-weight: bold; }
        .nav-en { font-size: 9px; margin-top: 2px; opacity: 0.7; letter-spacing: 0.1em; }

        nav ul li a::after {
            content: ""; position: absolute; bottom: -2px; left: 0; width: 0; height: 2px;
            background: #ffeb3b; transition: width 0.3s ease;
        }
        nav ul li a:hover { color: #ffeb3b; transform: scale(1.1); }
        nav ul li a:hover::after { width: 100%; }

        /* スマホ用メニューボタン */
        .menu-btn { display: none; cursor: pointer; z-index: 110; background: none; border: none; flex-direction: column; gap: 6px; padding: 10px; }
        .menu-btn span { display: block; width: 30px; height: 2px; background: white; transition: 0.3s; }

        @media (max-width: 1024px) {
            header { padding: 15px 20px; }
            .company-name { font-size: 18px; }
            .menu-btn { display: flex; }
            nav { 
                position: fixed; top: 0; right: -100%; width: 100%; height: 100vh; 
                background: rgba(0, 71, 157, 0.98); transition: 0.5s; 
                display: flex; align-items: center; justify-content: center; z-index: 105; 
            }
            nav.active { right: 0; }
            nav ul { flex-direction: column; gap: 40px; text-align: center; }
            .nav-jp { font-size: 22px; }
            .menu-btn.active span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
            .menu-btn.active span:nth-child(2) { opacity: 0; }
            .menu-btn.active span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }
        }

        /* --- 3. メインビジュアル --- */
        .hero {
            position: relative; width: 100%; height: 100vh;
            /* 背景画像を設定してください */
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('hero-bg.jpg') center/cover no-repeat;
            display: flex; align-items: center; justify-content: center; color: white; text-align: center;
        }
        .hero-content h2 { font-size: 3.5rem; letter-spacing: 0.1em; margin-bottom: 20px; line-height: 1.3; }
        .hero-content p { font-size: 1.2rem; opacity: 0.9; letter-spacing: 0.05em; }

        /* --- 4. 縦書きスクロールアニメーション --- */
        .scroll-down {
            position: absolute;
            bottom: 30px;
            right: 50px;
            writing-mode: vertical-rl; /* 縦書き */
            font-size: 12px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: white;
            z-index: 10;
        }
        .scroll-down span {
            display: block;
            position: absolute;
            bottom: -90px;
            left: 50%;
            width: 1px;
            height: 80px;
            background: rgba(255, 255, 255, 0.3);
            overflow: hidden;
        }
        /* 動く線のアニメーション */
        .scroll-down span::after {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #ffeb3b; /* 会社のアクセントカラーの黄色 */
            animation: scrollLine 2.5s cubic-bezier(1, 0, 0, 1) infinite;
        }

        @keyframes scrollLine {
            0% { transform: scaleY(0); transform-origin: 0 0; }
            50% { transform: scaleY(1); transform-origin: 0 0; }
            50.1% { transform: scaleY(1); transform-origin: 0 100%; }
            100% { transform: scaleY(0); transform-origin: 0 100%; }
        }

        /* --- 5. フッター --- */
        footer { background: #222; color: #fff; padding: 40px; text-align: center; font-size: 13px; }

        @media (max-width: 768px) {
            .hero-content h2 { font-size: 2.2rem; }
            .scroll-down { right: 20px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo-area">
            <img src="miko.png" alt="ロゴ" class="logo-image">
            <span class="company-name">大和電気株式会社</span>
        </a>
        <button class="menu-btn" id="menuBtn"><span></span><span></span><span></span></button>
        <nav id="navMenu">
            <ul>
                <li><a href="company.html"><span class="nav-jp">会社概要</span><span class="nav-en">Company</span></a></li>
                <li><a href="business.html"><span class="nav-jp">事業案内</span><span class="nav-en">Business</span></a></li>
                <li><a href="trouble.html"><span class="nav-jp">困ったときは</span><span class="nav-en">Trouble</span></a></li>
                <li><a href="contact.html"><span class="nav-jp">お問い合わせ</span><span class="nav-en">Contact</span></a></li>
                <li><a href="recruit.html"><span class="nav-jp">採用情報</span><span class="nav-en">Recruit</span></a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h2>光り輝く未来を、<br>確かな技術で。</h2>
            <p>宮城県名取市を拠点に、電気設備・空調の設計施工を担います</p>
        </div>

        <div class="scroll-down">
            SCROLL
            <span></span>
        </div>
    </section>

    <div style="height: 100vh; display: flex; align-items: center; justify-content: center; background: #fff;">
        <p>コンテンツエリア（スクロールして確認してください）</p>
    </div>

    <footer>&copy; 2026 大和電気株式会社 All Rights Reserved.</footer>

    <script>
        // スマホ用ハンバーガーメニューの動作
        const menuBtn = document.getElementById('menuBtn');
        const navMenu = document.getElementById('navMenu');

        menuBtn.addEventListener('click', () => {
            menuBtn.classList.toggle('active');
            navMenu.classList.toggle('active');
        });

        // リンクをクリックした時にメニューを閉じる（スマホ対策）
        const navLinks = document.querySelectorAll('nav ul li a');
        navLinks.forEach(link => {
            link.addEventListener('click', () => {
                menuBtn.classList.remove('active');
                navMenu.classList.remove('active');
            });
        });
    </script>

</body>
</html>
