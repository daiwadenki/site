<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大和電気株式会社 | 宮城県名取市の電気工事・空調設備</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <style>
        /* --- 1. 基本設定 --- */
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: #fff; color: #333; overflow-x: hidden;
        }

        /* --- 2. ヘッダー（共通ナビゲーション） --- */
        header {
            position: fixed; top: 0; width: 100%; padding: 15px 40px;
            z-index: 1000; /* 最前面に固定 */
            background: rgba(0, 0, 0, 0.7); 
            display: flex; justify-content: space-between; align-items: center; 
            backdrop-filter: blur(8px);
        }
        .logo-area { display: flex; align-items: center; text-decoration: none; color: white; }
        .logo-image { height: 50px; width: auto; margin-right: 15px; }
        .company-name { font-size: 24px; font-weight: bold; letter-spacing: 0.1em; }

        nav ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 30px; }
        nav ul li a { 
            text-decoration: none; color: white; 
            display: flex; flex-direction: column; align-items: center; 
            transition: 0.3s; position: relative;
        }
        .nav-jp { font-size: 14px; font-weight: bold; }
        .nav-en { font-size: 9px; margin-top: 2px; opacity: 0.7; letter-spacing: 0.1em; text-transform: uppercase; }

        /* ホバーエフェクト */
        nav ul li a::after {
            content: ""; position: absolute; bottom: -5px; left: 0; width: 0; height: 2px;
            background: #ffeb3b; transition: 0.3s;
        }
        nav ul li a:hover { color: #ffeb3b; }
        nav ul li a:hover::after { width: 100%; }

        /* スマホ用メニューボタン */
        .menu-btn { display: none; cursor: pointer; background: none; border: none; flex-direction: column; gap: 6px; padding: 10px; }
        .menu-btn span { display: block; width: 25px; height: 2px; background: white; transition: 0.3s; }

        @media (max-width: 1024px) {
            header { padding: 15px 20px; }
            .company-name { font-size: 18px; }
            .menu-btn { display: flex; }
            nav { 
                position: fixed; top: 0; right: -100%; width: 80%; height: 100vh; 
                background: rgba(0, 71, 157, 0.95); transition: 0.4s; 
                display: flex; align-items: center; justify-content: center;
            }
            nav.active { right: 0; }
            nav ul { flex-direction: column; gap: 40px; text-align: center; }
            .nav-jp { font-size: 20px; }
        }

        /* --- 3. メインビジュアル --- */
        .hero {
            position: relative; width: 100%; height: 100vh;
            background: #222 url('hero-bg.jpg') center/cover no-repeat;
            display: flex; align-items: center; justify-content: center; color: white;
        }
        .hero-inner { text-align: center; z-index: 10; }
        .hero-inner h2 { font-size: 3.5rem; margin: 0 0 20px; letter-spacing: 0.15em; line-height: 1.4; }
        .hero-inner p { font-size: 1.2rem; margin: 0; opacity: 0.9; letter-spacing: 0.1em; }

        /* --- 4. 縦書きSCROLLアニメーション --- */
        .scroll-wrapper {
            position: absolute;
            bottom: 40px;
            right: 50px;
            z-index: 20;
            color: white;
            font-size: 11px;
            letter-spacing: 0.3em;
            writing-mode: vertical-rl; /* 縦書き */
            text-transform: uppercase;
        }
        .scroll-line {
            position: relative;
            display: inline-block;
            width: 1px;
            height: 100px; /* 全体の長さ */
            margin-top: 15px;
            background: rgba(255, 255, 255, 0.2);
            overflow: hidden;
        }
        /* 動く白い線 */
        .scroll-line::before {
            content: "";
            position: absolute;
            top: -100px;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffeb3b; /* 会社のアクセントカラー */
            animation: scroll-anim 3s infinite;
        }

        @keyframes scroll-anim {
            0% { top: -100px; }
            30% { top: 0; }
            60% { top: 100px; }
            100% { top: 100px; }
        }

        /* --- 5. フッター --- */
        footer { background: #111; color: #777; padding: 30px; text-align: center; font-size: 12px; }

        @media (max-width: 768px) {
            .hero-inner h2 { font-size: 2rem; }
            .scroll-wrapper { right: 20px; bottom: 20px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo-area">
            <img src="miko.png" alt="ロゴ" class="logo-image">
            <span class="company-name">大和電気株式会社</span>
        </a>
        <button class="menu-btn" id="menuBtn">
            <span></span><span></span><span></span>
        </button>
        <nav id="navMenu">
            <ul>
                <li><a href="company.html"><span class="nav-jp">会社概要</span><span class="nav-en">Company</span></a></li>
                <li><a href="business.html"><span class="nav-jp">事業案内</span><span class="nav-en">Business</span></a></li>
                <li><a href="trouble.html"><span class="nav-jp">困ったときは</span><span class="nav-en">Trouble</span></a></li>
                <li><a href="contact.html"><span class="nav-jp">お問い合わせ</span><span class="nav-en">Contact</span></a></li>
                <li><a href="recruit.html"><span class="nav-jp">採用情報</span><span class="nav-en">Recruit</span></a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="hero-inner">
                <h2>光り輝く未来を、<br>確かな技術で。</h2>
                <p>宮城県名取市を拠点に、電気設備・空調の設計施工を担います</p>
            </div>

            <div class="scroll-wrapper">
                SCROLL
                <span class="scroll-line"></span>
            </div>
        </section>

        <section style="padding: 100px 20px; text-align: center;">
            <p>ここから下のコンテンツが始まります。</p>
        </section>
    </main>

    <footer>
        &copy; 2026 大和電気株式会社 All Rights Reserved.
    </footer>

    <script>
        // ハンバーガーメニューの開閉
        const menuBtn = document.getElementById('menuBtn');
        const navMenu = document.getElementById('navMenu');

        menuBtn.addEventListener('click', () => {
            navMenu.classList.toggle('active');
            // ボタンのアニメーション（三本線から✕へ）
            const spans = menuBtn.querySelectorAll('span');
            menuBtn.classList.toggle('open');
            if(navMenu.classList.contains('active')) {
                spans[0].style.transform = 'translateY(8px) rotate(45deg)';
                spans[1].style.opacity = '0';
                spans[2].style.transform = 'translateY(-8px) rotate(-45deg)';
            } else {
                spans[0].style.transform = 'none';
                spans[1].style.opacity = '1';
                spans[2].style.transform = 'none';
            }
        });
    </script>
</body>
</html>
